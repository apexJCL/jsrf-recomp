schema: spec-driven

context: |
  Project: static recompilation of the original Xbox game Jet Set Radio Future (title
  0x5345000A) into a native executable, built on the xboxrecomp toolkit and
  driven by xboxrecomp-cli (./skates).
  Layout: src/main.c is the host entry point; src/recomp_manual.c holds
  hand-written overrides; src/recomp/gen/ is generated by `skates analyze` and
  `skates recomp` and is never hand-edited (missed functions are seeded in
  config/seed_functions.json); game_files/ holds the user's own dump and is
  never committed.
  Constraints: no game data, frames, audio or saves are ever committed.
